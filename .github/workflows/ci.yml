name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  tests:
    runs-on: ubuntu-latest
    steps:
      # Pull down the repository contents for the workflow
      - name: Checkout repository
        uses: actions/checkout@v4

      # Provision Python 3.11 for installing and testing
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"
          cache-dependency-path: |
            requirements.txt
            backend/pyproject.toml

      # Install runtime and test dependencies
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pytest

      # Execute the pytest suite from the backend module
      - name: Run tests
        working-directory: backend
        run: pytest tests
