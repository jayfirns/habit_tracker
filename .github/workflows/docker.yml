name: Docker Build

on:
  push:
    branches: [main]
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      # Pull down the repository to access the Docker context
      - name: Checkout repository
        uses: actions/checkout@v4

      # Build the backend image without pushing it
      - name: Build Docker image
        run: docker build -f backend/Dockerfile -t habit-tracker:ci backend
