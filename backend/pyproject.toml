[project]
name = "focusos_backend"
version = "0.1.0"
description = "Backend for FocusOS web application"
dependencies = [
    "fastapi",
    "sqlalchemy",
    "alembic",
    "uvicorn",
]

[project.optional-dependencies]
dev = [
    "pytest",
    "httpx",
]

[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"
